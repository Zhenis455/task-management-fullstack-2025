services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager_local_only
      POSTGRES_DB: taskmanager
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      DATABASE_URL: "host=postgres user=taskmanager password=taskmanager_local_only dbname=taskmanager port=5432 sslmode=disable"
      ADDR: ":8082"
volumes:
  pg_data:
